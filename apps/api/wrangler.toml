# Configuração do Worker da API (docs/ARQUITETURA.md, seções 1, 4, 6, 7 e 9).
#
# O nível de cima é a PRODUÇÃO. Os bindings e as variáveis não são herdados pelos
# ambientes: o ambiente `previa` repete todos. No computador, `wrangler dev` usa estes
# mesmos bindings com R2 simulado e o Postgres do Docker, e o arquivo `.dev.vars` troca
# AMBIENTE para "local" (sem ele, a API se comporta como produção).
#
# Ainda a preencher: ACCESS_AUD da prévia.
# Segredos (wrangler secret put): TURNSTILE_SECRET e IP_HASH_SECRET.
#
# E-mail do "Fale com a ONG" (RN51): binding EMAIL do Email Routing, só na produção, porque
# exige o domínio sospatas.org.br no Cloudflare e o destino verificado (etapa 14). Na prévia
# e no computador sem o binding, o formulário responde 503 e o site mostra o e-mail da ONG.

name = "sospatas-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
# Produção só no domínio próprio, no mesmo endereço do site (sem CORS): sospatas.org.br/api/*.
# Sem o endereço *.workers.dev nem as URLs de versão, que ficariam fora do Access.
routes = [{ pattern = "sospatas.org.br/api/*", zone_name = "sospatas.org.br" }]
workers_dev = false
preview_urls = false

[vars]
AMBIENTE = "producao"
# Login da equipe pelo Cloudflare Access (docs/ARQUITETURA.md, seção 4)
ACCESS_TEAM_DOMAIN = "https://sospatas.cloudflareaccess.com"
# Aplicação "Área da ONG" do Access (sospatas.org.br/admin e /api/admin), criada em 14/10/2026
ACCESS_AUD = "6ce615f6a13e948f53cf703686969d281247e33156525521813a81007ae32a88"
# Origens com CORS liberado, separadas por vírgula. Vazio = nenhuma (mesma origem).
CORS_ORIGENS = ""
# Endereço público das fotos (bucket FOTOS com cache). Vazio = a API serve as fotos em
# /api/publico/fotos/* (computador e prévia, sem domínio próprio e sem r2.dev).
FOTOS_URL_BASE = "https://fotos.sospatas.org.br"
# Formulário "Fale com a ONG" (RN51): remetente do domínio e destino verificado no Email Routing
EMAIL_REMETENTE = "site@sospatas.org.br"
EMAIL_DESTINO = "sitesospatas@gmail.com"

# Tarefa diária às 03:00 de Brasília (06:00 UTC): limpezas da RN15 (e da RN25 e RN27, etapa 11)
[triggers]
crons = ["0 6 * * *"]

[[hyperdrive]]
binding = "HYPERDRIVE"
# Hyperdrive "sospatas" → Neon sospatas, branch production, usuário sospatas_api, sem cache (14/10/2026)
id = "8204d3527a194ef39de71db6ebf828a7"
localConnectionString = "postgres://sospatas:sospatas@localhost:5432/sospatas"

[[r2_buckets]]
binding = "FOTOS"
bucket_name = "sospatas-fotos"

[[r2_buckets]]
binding = "QUARENTENA"
bucket_name = "sospatas-quarentena"

[[send_email]]
name = "EMAIL"
destination_address = "sitesospatas@gmail.com"

[env.previa]
name = "sospatas-api-previa"
# API da prévia em https://sospatas-api-previa.sospatas.workers.dev (subdomínio criado em 09/10/2026).
# Sem as URLs de versão do Worker (preview_urls): a prévia já é o ambiente de teste.
workers_dev = true
preview_urls = false

[env.previa.vars]
AMBIENTE = "previa"
ACCESS_TEAM_DOMAIN = "https://sospatas.cloudflareaccess.com"
ACCESS_AUD = "preencher-na-etapa-8"
# Site da prévia no Pages: a develop publica em develop.sospatas.pages.dev (desde a etapa 14,
# quando a main virou a branch de produção do Pages); sospatas.pages.dev fica para a transição
CORS_ORIGENS = "https://develop.sospatas.pages.dev,https://sospatas.pages.dev"
# O site (pages.dev) e a API (workers.dev) ficam em domínios diferentes: a URL das fotos precisa
# ser completa, apontando para a rota de fotos deste Worker.
FOTOS_URL_BASE = "https://sospatas-api-previa.sospatas.workers.dev/api/publico/fotos"
EMAIL_REMETENTE = "site@sospatas.org.br"
EMAIL_DESTINO = "sitesospatas@gmail.com"

[env.previa.triggers]
crons = ["0 6 * * *"]

[[env.previa.hyperdrive]]
binding = "HYPERDRIVE"
# Hyperdrive "sospatas-previa" → projeto sospatas-previa do Neon (criado em 09/10/2026)
id = "a16fb429734b4be69ed174dc6e16bf30"
localConnectionString = "postgres://sospatas:sospatas@localhost:5432/sospatas"

[[env.previa.r2_buckets]]
binding = "FOTOS"
bucket_name = "sospatas-fotos-previa"

[[env.previa.r2_buckets]]
binding = "QUARENTENA"
bucket_name = "sospatas-quarentena-previa"
