# Configuração do Worker da API (docs/ARQUITETURA.md, seções 1, 4, 6, 7 e 9).
#
# O nível de cima é a PRODUÇÃO. Os bindings e as variáveis não são herdados pelos
# ambientes: o ambiente `previa` repete todos. No computador, `wrangler dev` usa estes
# mesmos bindings com R2 simulado e o Postgres do Docker, e o arquivo `.dev.vars` troca
# AMBIENTE para "local" (sem ele, a API se comporta como produção).
#
# Ainda a preencher: id real do Hyperdrive e ACCESS_AUD (etapa 8 na prévia, etapa 14 na
# produção) e rota sospatas.org.br/api/* (etapa 14). Segredos (wrangler secret put):
# TURNSTILE_SECRET e IP_HASH_SECRET.
#
# E-mail do "Fale com a ONG" (RN51): binding EMAIL do Email Routing, só na produção, porque
# exige o domínio sospatas.org.br no Cloudflare e o destino verificado (etapa 14). Na prévia
# e no computador sem o binding, o formulário responde 503 e o site mostra o e-mail da ONG.

name = "sospatas-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

[vars]
AMBIENTE = "producao"
# Login da equipe pelo Cloudflare Access (docs/ARQUITETURA.md, seção 4)
ACCESS_TEAM_DOMAIN = "https://sospatas.cloudflareaccess.com"
ACCESS_AUD = "preencher-na-etapa-14"
# Origens com CORS liberado, separadas por vírgula. Vazio = nenhuma (mesma origem).
CORS_ORIGENS = ""
# Endereço público das fotos (bucket FOTOS com cache). Vazio = a API serve as fotos em
# /api/publico/fotos/* (computador e prévia, sem domínio próprio e sem r2.dev).
FOTOS_URL_BASE = "https://fotos.sospatas.org.br"
# Formulário "Fale com a ONG" (RN51): remetente do domínio e destino verificado no Email Routing
EMAIL_REMETENTE = "site@sospatas.org.br"
EMAIL_DESTINO = "sitesospatas@gmail.com"

# Tarefa diária às 03:00 de Brasília (06:00 UTC): limpezas da RN15 (e da RN25 e RN27, etapa 11)
[triggers]
crons = ["0 6 * * *"]

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "preencher-na-etapa-8"
localConnectionString = "postgres://sospatas:sospatas@localhost:5432/sospatas"

[[r2_buckets]]
binding = "FOTOS"
bucket_name = "sospatas-fotos"

[[r2_buckets]]
binding = "QUARENTENA"
bucket_name = "sospatas-quarentena"

[[send_email]]
name = "EMAIL"
destination_address = "sitesospatas@gmail.com"

[env.previa]
name = "sospatas-api-previa"

[env.previa.vars]
AMBIENTE = "previa"
ACCESS_TEAM_DOMAIN = "https://sospatas.cloudflareaccess.com"
ACCESS_AUD = "preencher-na-etapa-8"
CORS_ORIGENS = ""
FOTOS_URL_BASE = ""
EMAIL_REMETENTE = "site@sospatas.org.br"
EMAIL_DESTINO = "sitesospatas@gmail.com"

[env.previa.triggers]
crons = ["0 6 * * *"]

[[env.previa.hyperdrive]]
binding = "HYPERDRIVE"
id = "preencher-na-etapa-8"
localConnectionString = "postgres://sospatas:sospatas@localhost:5432/sospatas"

[[env.previa.r2_buckets]]
binding = "FOTOS"
bucket_name = "sospatas-fotos-previa"

[[env.previa.r2_buckets]]
binding = "QUARENTENA"
bucket_name = "sospatas-quarentena-previa"
