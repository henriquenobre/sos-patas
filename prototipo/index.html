// ---------------------------------------------------------------------------

const meses = a => { const n = a.nascimento_aprox;                     // meses completos de calendário
  return Math.max(0, (hoje.getFullYear() - n.getFullYear()) * 12 + hoje.getMonth() - n.getMonth() - (hoje.getDate() < n.getDate() ? 1 : 0)); };
const ehAdulto = a => meses(a) >= 12;                                   // RN11
const diasEsperando = a => Math.floor((hoje - a.data_entrada) / 864e5);
function idadeTexto(a) {                                               // RN13
  const m = meses(a);
  if (m < 12) return `cerca de ${Math.max(1, m)} ${m <= 1 ? 'mês' : 'meses'}`;
  const anos = Math.floor(m / 12);
  return `cerca de ${anos} ${anos === 1 ? 'ano' : 'anos'}`;
}
function esperaTexto(a) {
  const d = diasEsperando(a);
  if (d < 60) return `${d} dias`;
  if (d < 365) return `${Math.floor(d / 30)} meses`;
  const anos = Math.floor(d / 365), resto = Math.floor((d % 365) / 30);
  return `${anos} ${anos === 1 ? 'ano' : 'anos'}${resto ? ` e ${resto} ${resto === 1 ? 'mês' : 'meses'}` : ''}`;
}

const esperandoMaisTempo = () => disponiveis()
  .filter(a => ehAdulto(a) && diasEsperando(a) > 90).slice(0, 6);       // RN12
const msgWhats = a => `Olá! Vi ${a.sexo === 'femea' ? 'a' : 'o'} ${a.nome} no site da SOS Patas e tenho interesse em adotar. Pode me passar mais informações?`; // RN14

function foto(a, classe = '', semRotulo = false) {

}

// ---------------------------------------------------------------------------
const filtros = { especie: '', porte: '', idade: '', convive: false };
function chip(grupo, valor, texto) {
  const ativo = filtros[grupo] === valor;
  return `<button onclick="setFiltro('${grupo}','${valor}')" class="shrink-0 rounded-full border-2 px-3.5 py-1.5 text-sm font-bold ${ativo ? 'border-azul bg-azul text-white' : 'border-slate-200 bg-white text-slate-700'}">${texto}</button>`;
}
function setFiltro(g, v) { filtros[g] = filtros[g] === v ? '' : v; render(); }
function telaVitrine() {
  const lista = disponiveis().filter(a =>
    (!filtros.especie || a.especie === filtros.especie) &&
    (!filtros.porte || a.porte === filtros.porte) &&
    (!filtros.idade || (filtros.idade === 'adulto' ? ehAdulto(a) : !ehAdulto(a))) &&
    (!filtros.convive || a.convive_animais === true));
  return pagina(titulo('Animais para adoção', `${disponiveis().length} cães e gatos esperando uma família`) + `
  <div class="sticky top-[60px] z-20 border-b border-slate-200 bg-fundo/95 backdrop-blur">
    <div class="no-scrollbar mx-auto flex max-w-6xl gap-2 overflow-x-auto px-4 py-3">
      ${chip('especie', 'cao', '🐶 Cães')}${chip('especie', 'gato', '🐱 Gatos')}
      <span class="mx-1 w-px shrink-0 bg-slate-300"></span>
      ${chip('idade', 'filhote', 'Filhotes')}${chip('idade', 'adulto', 'Adultos')}
      <span class="mx-1 w-px shrink-0 bg-slate-300"></span>
      ${chip('porte', 'pequeno', 'Pequeno')}${chip('porte', 'medio', 'Médio')}${chip('porte', 'grande', 'Grande')}
      <span class="mx-1 w-px shrink-0 bg-slate-300"></span>
      <button onclick="filtros.convive=!filtros.convive;render()" class="shrink-0 rounded-full border-2 px-3.5 py-1.5 text-sm font-bold ${filtros.convive ? 'border-azul bg-azul text-white' : 'border-slate-200 bg-white text-slate-700'}">Convive com outros animais</button>
    </div>
  </div>
  <section class="mx-auto max-w-6xl px-4 pt-5">
    <p class="mb-3 text-sm font-semibold text-slate-500">${lista.length} ${lista.length === 1 ? 'animal encontrado' : 'animais encontrados'} · mais antigos primeiro</p>
    ${lista.length ? `<div class="grid grid-cols-2 gap-3 md:grid-cols-3 lg:grid-cols-4">${lista.map(a => cardAnimal(a, ehAdulto(a) && diasEsperando(a) > 90)).join('')}</div>`
    : `<div class="rounded-2xl bg-white p-8 text-center ring-1 ring-slate-200"><p class="font-bold text-slate-700">Nenhum animal com esses filtros.</p><button onclick="Object.assign(filtros,{especie:'',porte:'',idade:'',convive:false});render()" class="mt-2 font-bold text-azul underline">Limpar filtros</button></div>`}
  </section>`);
}

function item(ok, texto) {

  return `<li class="flex items-center gap-2 ${ok ? 'text-slate-800' : 'text-slate-500'}"><span class="flex h-6 w-6 items-center justify-center rounded-full ${ok ? 'bg-emerald-100 text-emerald-700' : 'bg-slate-100 text-slate-500'}">${ok ? icone.check : icone.x}</span>${texto}</li>`;
}

  const a = animais.find(x => x.id === id);

  const ela = a.sexo === 'femea';
  return pagina(`
  <div class="mx-auto max-w-6xl px-4 pt-4"><a href="#/animais" class="inline-flex items-center gap-1 font-bold text-azul">${icone.voltar} Voltar</a></div>

      ${a.fotos.length > 1 ? `<div class="mt-2 grid grid-cols-3 gap-2">${a.fotos.map((f, i) => `<img src="${f}" alt="" class="aspect-square w-full rounded-xl object-cover ring-2 ${i === 0 ? 'ring-azul' : 'ring-transparent opacity-70'}">`).join('')}</div>` : ''}
    </div>
    <div>
      ${a.status === 'adotado' ? tag('Adotado 💙', 'verde') : ehAdulto(a) && diasEsperando(a) > 90 ? tag(`Esperando há ${esperaTexto(a)}`, 'vermelho') : ''}
      <h1 class="mt-2 font-titulo text-5xl font-extrabold text-azul-escuro">${a.nome}</h1>
      <div class="mt-2 flex flex-wrap gap-2">${tag(rotulo.especie[a.especie])}${tag(rotulo.sexo[a.sexo])}${tag(idadeTexto(a))}${tag('Porte ' + rotulo.porte[a.porte].toLowerCase())}</div>

      <div class="mt-5 grid gap-4 sm:grid-cols-2">
        <div class="rounded-2xl bg-white p-4 ring-1 ring-slate-200">
          <p class="mb-2 text-xs font-extrabold uppercase tracking-wide text-slate-500">Saúde</p>
          <ul class="space-y-2 font-semibold">
            ${a.castrado ? item(true, ela ? 'Castrada' : 'Castrado') : `<li class="flex items-center gap-2 text-[#9A5B00]"><span class="flex h-6 w-6 items-center justify-center rounded-full bg-amarelo-claro">${icone.check}</span>Castração garantida pela ONG</li>`}
            ${item(a.vacinado, ela ? 'Vacinada' : 'Vacinado')}
            ${item(a.vermifugado, ela ? 'Vermifugada' : 'Vermifugado')}
          </ul>
        </div>
        <div class="rounded-2xl bg-white p-4 ring-1 ring-slate-200">
          <p class="mb-2 text-xs font-extrabold uppercase tracking-wide text-slate-500">Temperamento</p>

let abaAdmin = 'disponivel', buscaAdmin = '';
function telaPainel() {
  const lista = animais.filter(a => a.status === abaAdmin && a.nome.toLowerCase().includes(buscaAdmin.toLowerCase()))
    .sort((x, y) => x.data_entrada - y.data_entrada);
  const qtd = s => animais.filter(a => a.status === s).length;
  const adotadosMes = animais.filter(a => a.status === 'adotado' && a.data_adocao && (hoje - a.data_adocao) < 30 * 864e5).length;
  return cabecalhoAdmin() + `<main class="mx-auto max-w-3xl px-4 pb-28 pt-4">
    <div class="grid grid-cols-3 gap-2 text-center">
      <div class="rounded-2xl bg-white p-3 ring-1 ring-slate-200"><p class="font-titulo text-2xl font-extrabold text-azul">${qtd('disponivel')}</p><p class="text-xs font-semibold text-slate-500">disponíveis</p></div>
      <div class="rounded-2xl bg-white p-3 ring-1 ring-slate-200"><p class="font-titulo text-2xl font-extrabold text-vermelho">${disponiveis().filter(a => ehAdulto(a) && diasEsperando(a) > 90).length}</p><p class="text-xs font-semibold text-slate-500">esperando +90 dias</p></div>
      <div class="rounded-2xl bg-white p-3 ring-1 ring-slate-200"><p class="font-titulo text-2xl font-extrabold text-emerald-600">${adotadosMes}</p><p class="text-xs font-semibold text-slate-500">adotados no mês</p></div>
    </div>
    <div class="mt-4 flex rounded-xl bg-slate-200 p-1 font-bold">
      <button onclick="abaAdmin='disponivel';render()" class="flex-1 rounded-lg py-2 ${abaAdmin === 'disponivel' ? 'bg-white text-azul-escuro shadow' : 'text-slate-600'}">Disponíveis (${qtd('disponivel')})</button>
      <button onclick="abaAdmin='adotado';render()" class="flex-1 rounded-lg py-2 ${abaAdmin === 'adotado' ? 'bg-white text-azul-escuro shadow' : 'text-slate-600'}">Adotados (${qtd('adotado')})</button>
    </div>
    <input oninput="buscaAdmin=this.value;render();const b=document.getElementById('busca');b.focus();b.setSelectionRange(b.value.length,b.value.length)" value="${buscaAdmin}" placeholder="Buscar pelo nome…" class="mt-3 w-full rounded-xl border-2 border-slate-200 bg-white px-4 py-3 text-base focus:border-azul focus:outline-none" id="busca">
    <ul class="mt-3 space-y-2">
      ${lista.map(a => `<li class="flex items-center gap-3 rounded-2xl bg-white p-2.5 ring-1 ring-slate-200">
        <div class="h-16 w-16 shrink-0 overflow-hidden rounded-xl">${foto(a, '', true)}</div>
        <div class="min-w-0 flex-1">
          <p class="truncate font-titulo text-lg font-bold leading-tight text-azul-escuro">${a.nome}</p>
          <p class="truncate text-xs text-slate-500">${rotulo.especie[a.especie]} · ${idadeTexto(a)} · ${a.privado.lar_nome}</p>
          <p class="text-xs font-bold ${a.status === 'adotado' ? 'text-emerald-600' : diasEsperando(a) > 90 && ehAdulto(a) ? 'text-vermelho' : 'text-slate-500'}">${a.status === 'adotado' ? 'Adotado há ' + Math.floor((hoje - a.data_adocao) / 864e5) + ' dias' : 'Esperando há ' + esperaTexto(a)}</p>
        </div>
        <div class="flex shrink-0 flex-col gap-1.5">
          <a href="#/admin/editar/${a.id}" class="rounded-lg bg-azul-claro px-3 py-1.5 text-center text-xs font-extrabold text-azul">Editar</a>
          ${a.status === 'disponivel' ? `<button onclick="confirmarAdocao('${a.id}')" class="rounded-lg bg-emerald-50 px-3 py-1.5 text-xs font-extrabold text-emerald-700">Adotado ✓</button>` : ''}
        </div>
      </li>`).join('') || '<li class="rounded-2xl bg-white p-6 text-center text-slate-500 ring-1 ring-slate-200">Nenhum animal aqui.</li>'}
    </ul>
    <a href="#/admin/novo" class="fixed bottom-5 right-5 z-30 flex items-center gap-2 rounded-full bg-vermelho px-5 py-4 text-lg font-extrabold text-white shadow-xl" style="margin-bottom:env(safe-area-inset-bottom,0px)">＋ Cadastrar animal</a>
  </main>`;
}

// T10 / T11 · Formulário
function opcoes(nome, valores, atual) {
  return `<div class="flex gap-2">${Object.entries(valores).map(([v, t]) => `<label class="flex-1"><input type="radio" name="${nome}" value="${v}" class="peer sr-only" ${atual === v ? 'checked' : ''}><span class="block cursor-pointer rounded-xl border-2 border-slate-200 bg-white py-3 text-center font-bold text-slate-700 peer-checked:border-azul peer-checked:bg-azul peer-checked:text-white">${t}</span></label>`).join('')}</div>`;
}
function simNao(nome, atual, comNaoSei = false) {
  const v = { sim: 'Sim', nao: 'Não' }; if (comNaoSei) v.nsei = 'Não sei';
  const at = atual === true ? 'sim' : atual === false ? 'nao' : comNaoSei ? 'nsei' : '';
  return opcoes(nome, v, at);
}
const campo = (rotuloTxt, html, dica = '') => `<div><p class="mb-1.5 text-sm font-extrabold text-slate-700">${rotuloTxt}</p>${html}${dica ? `<p class="mt-1 text-xs text-slate-500">${dica}</p>` : ''}</div>`;
const input = (nome, valor = '', ph = '', tipo = 'text') => `<input name="${nome}" type="${tipo}" value="${valor}" placeholder="${ph}" class="w-full rounded-xl border-2 border-slate-200 bg-white px-4 py-3 text-base focus:border-azul focus:outline-none">`;

let fotosForm = [];
function telaForm(id) {
  const a = id ? animais.find(x => x.id === id) : null;
  if (id && !a) return telaPainel();
  if (!telaForm._ultimo || telaForm._ultimo !== (id || 'novo')) { fotosForm = a ? [...a.fotos] : []; telaForm._ultimo = id || 'novo'; }
  const idadeMeses = a ? meses(a) : '';
  return cabecalhoAdmin('#/admin') + `<main class="mx-auto max-w-xl px-4 pb-32 pt-4">
    <h1 class="font-titulo text-3xl font-extrabold text-azul-escuro">${a ? 'Editar ' + a.nome : 'Cadastrar animal'}</h1>
    <form class="mt-4 space-y-6" onsubmit="event.preventDefault(); salvar('${id || ''}', this)">
      <section class="space-y-4 rounded-2xl bg-white p-4 ring-1 ring-slate-200">
        <h2 class="font-extrabold text-azul">📷 Fotos</h2>
        <div class="grid grid-cols-3 gap-2">
          ${[0, 1, 2].map(i => fotosForm[i]
            ? `<div class="relative aspect-square overflow-hidden rounded-xl"><img src="${fotosForm[i]}" class="h-full w-full object-cover" alt="">${i === 0 ? '<span class="absolute bottom-1 left-1 rounded bg-azul px-1.5 text-[10px] font-bold text-white">Principal</span>' : ''}<button type="button" onclick="fotosForm.splice(${i},1);render()" class="absolute right-1 top-1 flex h-7 w-7 items-center justify-center rounded-full bg-black/60 text-white" aria-label="Remover foto">${icone.x}</button></div>`
            : `<label class="flex aspect-square cursor-pointer flex-col items-center justify-center rounded-xl border-2 border-dashed border-slate-300 bg-slate-50 text-slate-500"><span class="text-2xl">＋</span><span class="text-xs font-bold">Adicionar</span><input type="file" accept="image/*" class="hidden" onchange="addFoto(this)"></label>`).join('')}
        </div>
        <p class="text-xs text-slate-500">Até 3 fotos. A primeira é a principal. As fotos são reduzidas automaticamente antes do envio.</p>
      </section>

      <section class="space-y-4 rounded-2xl bg-white p-4 ring-1 ring-slate-200">
        <h2 class="font-extrabold text-azul">🐾 Sobre o animal</h2>
        ${campo('Nome *', input('nome', a ? a.nome : '', 'Ex.: Apolo'))}
        ${campo('Espécie *', opcoes('especie', { cao: '🐶 Cão', gato: '🐱 Gato' }, a ? a.especie : ''))}
        ${campo('Sexo *', opcoes('sexo', { macho: 'Macho', femea: 'Fêmea' }, a ? a.sexo : ''))}
        ${campo('Idade aproximada *', `<div class="flex gap-2">${input('idade', idadeMeses >= 12 ? Math.floor(idadeMeses / 12) : idadeMeses || '', 'Ex.: 4', 'number')}<select class="rounded-xl border-2 border-slate-200 bg-white px-3 font-bold"><option ${idadeMeses >= 12 ? 'selected' : ''}>anos</option><option ${idadeMeses !== '' && idadeMeses < 12 ? 'selected' : ''}>meses</option></select></div>`, 'O site calcula a idade sozinho com o passar do tempo.')}
        ${campo('Porte *', opcoes('porte', { pequeno: 'Pequeno', medio: 'Médio', grande: 'Grande' }, a ? a.porte : ''))}
        ${campo('Descrição', `<textarea maxlength="500" rows="3" placeholder="Jeito, manias, cuidados especiais…" class="w-full rounded-xl border-2 border-slate-200 px-4 py-3 text-base focus:border-azul focus:outline-none">${a ? a.descricao : ''}</textarea>`, 'Até 500 caracteres.')}
      </section>

      <section class="space-y-4 rounded-2xl bg-white p-4 ring-1 ring-slate-200">
        <h2 class="font-extrabold text-azul">💉 Saúde</h2>
        ${campo('Castrado? *', simNao('castrado', a ? a.castrado : null), 'Se "Não", o site mostra "Castração garantida pela ONG".')}
        ${campo('Vacinado? *', simNao('vacinado', a ? a.vacinado : null))}
        ${campo('Vermifugado? *', simNao('vermifugado', a ? a.vermifugado : null))}
      </section>

      <section class="space-y-4 rounded-2xl bg-white p-4 ring-1 ring-slate-200">
        <h2 class="font-extrabold text-azul">💛 Temperamento</h2>
        ${campo('É dócil?', simNao('docil', a ? a.docil : null, true))}
        ${campo('Convive com outros animais?', simNao('convive', a ? a.convive_animais : null, true))}
      </section>

      <section class="space-y-4 rounded-2xl bg-white p-4 ring-1 ring-slate-200">
        <h2 class="font-extrabold text-azul">📞 Responsável (aparece no site)</h2>
        ${campo('Quem é o responsável?', opcoes('resp', { ong: 'SOS Patas', protetor: 'Protetor parceiro' }, a ? a.responsavel_tipo : 'ong'))}
        ${campo('Nome do protetor', input('resp_nome', a && a.responsavel_tipo === 'protetor' ? a.responsavel_nome : '', 'Só se for protetor parceiro'))}
        ${campo('WhatsApp para contato', input('whats', a && a.whatsapp ? a.whatsapp : ONG.whatsappFormatado, '(35) 9 0000-0000', 'tel'), 'É para este número que vai o botão "Quero adotar".')}
      </section>

      <section class="space-y-4 rounded-2xl border-2 border-dashed border-amarelo bg-amarelo-claro p-4">
        <h2 class="font-extrabold text-[#9A5B00]">🔒 Só a equipe vê (não aparece no site)</h2>
        ${campo('Onde o animal está (lar temporário)', input('lar', a ? a.privado.lar_nome : '', 'Ex.: Lar da Claudia'))}
        ${campo('Tipo de lar', opcoes('lar_tipo', { provisorio: 'Provisório', remunerado: 'Remunerado' }, a ? a.privado.lar_tipo : ''))}
        ${campo('Data de entrada na ONG', input('entrada', (a ? a.data_entrada : hoje).toISOString().slice(0, 10), '', 'date'), 'Usada no destaque "Esperando há mais tempo".')}
        ${campo('Observações internas', `<textarea rows="2" class="w-full rounded-xl border-2 border-slate-200 px-4 py-3 text-base focus:border-azul focus:outline-none">${a ? a.privado.observacoes : ''}</textarea>`)}
      </section>

      ${a ? `<section class="space-y-3 rounded-2xl bg-white p-4 ring-1 ring-slate-200">
        <h2 class="font-extrabold text-slate-700">Outras ações</h2>
        ${a.status === 'disponivel' ? `<button type="button" onclick="confirmarAdocao('${a.id}')" class="w-full rounded-xl bg-emerald-50 py-3 font-extrabold text-emerald-700">Marcar como adotado ✓</button>` : `<button type="button" onclick="voltarDisponivel('${a.id}')" class="w-full rounded-xl bg-slate-100 py-3 font-extrabold text-slate-700">Voltar para disponível</button>`}
        <button type="button" onclick="confirmarExclusao('${a.id}')" class="w-full rounded-xl py-3 font-extrabold text-vermelho ring-2 ring-vermelho-claro">Excluir animal</button>
        <p class="text-xs text-slate-500">Use "Excluir" só para cadastro errado ou falecimento. Adoção deve ser marcada como "Adotado".</p>
      </section>` : ''}

      <div class="fixed inset-x-0 bottom-0 z-30 border-t border-slate-200 bg-white p-3" style="padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px)">
        <div class="mx-auto flex max-w-xl gap-2">
          <a href="#/admin" class="rounded-xl px-5 py-3.5 font-bold text-slate-600 ring-2 ring-slate-200">Cancelar</a>
          <button class="flex-1 rounded-xl bg-azul py-3.5 text-lg font-extrabold text-white">${a ? 'Salvar alterações' : 'Publicar no site'}</button>
        </div>
      </div>
    </form>
  </main>`;
}

// ---------------------------------------------------------------------------
// Ações (simuladas)
// ---------------------------------------------------------------------------
function abrirModal(html) { document.getElementById('modal-body').innerHTML = html; document.getElementById('modal').hidden = false; }
function fecharModal() { document.getElementById('modal').hidden = true; }
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') fecharModal(); });

function quero(id) {
  const a = animais.find(x => x.id === id);
  const numero = a.whatsapp || ONG.whatsapp;
  abrirModal(`<p class="text-xs font-extrabold uppercase tracking-wide text-slate-500">Protótipo</p>
    <h3 class="mt-1 font-titulo text-2xl font-bold text-azul-escuro">Aqui o WhatsApp abriria</h3>
    <p class="mt-2 text-sm text-slate-600">No site real, o botão abre a conversa com <b>${a.responsavel_nome}</b> (${numero}) já com esta mensagem:</p>
    <div class="mt-3 rounded-xl rounded-tl-none bg-[#DCF8C6] p-3 text-slate-800">${msgWhats(a)}</div>
    <button onclick="fecharModal()" class="mt-4 w-full rounded-xl bg-azul py-3 font-extrabold text-white">Entendi</button>`);
}
function copiarPix(btn) {
  try { navigator.clipboard.writeText(ONG.pix.replace(/\D/g, '')); } catch (e) {}
  const t = btn.textContent; btn.textContent = 'Chave copiada ✓'; setTimeout(() => btn.textContent = t, 1800);
}
function confirmarAdocao(id) {
  const a = animais.find(x => x.id === id);
  abrirModal(`<h3 class="font-titulo text-2xl font-bold text-azul-escuro">${a.nome} foi adotado? 🎉</h3>
    <p class="mt-2 text-slate-600">${a.nome} sai da vitrine e vai para a aba "Adotados". Ficamos só com a foto principal para economizar espaço.</p>
    <div class="mt-4 flex gap-2"><button onclick="fecharModal()" class="flex-1 rounded-xl py-3 font-bold ring-2 ring-slate-200">Cancelar</button>
    <button onclick="marcarAdotado('${id}')" class="flex-1 rounded-xl bg-emerald-600 py-3 font-extrabold text-white">Sim, foi adotado</button></div>`);
}
function marcarAdotado(id) {
  const a = animais.find(x => x.id === id);
  a.status = 'adotado'; a.data_adocao = new Date(); a.fotos = a.fotos.slice(0, 1); // RN07, RN08
  fecharModal(); location.hash = '#/admin'; abaAdmin = 'disponivel'; render();
  toast(`${a.nome} marcado como adotado 💙`);
}
function voltarDisponivel(id) { const a = animais.find(x => x.id === id); a.status = 'disponivel'; a.data_adocao = null; location.hash = '#/admin'; toast(`${a.nome} voltou para disponíveis`); }
function confirmarExclusao(id) {
  const a = animais.find(x => x.id === id);
  abrirModal(`<h3 class="font-titulo text-2xl font-bold text-vermelho">Excluir ${a.nome}?</h3>
    <p class="mt-2 text-slate-600">Esta ação não pode ser desfeita. O cadastro e <b>todas as fotos</b> serão apagados.</p>
    <p class="mt-2 rounded-xl bg-amarelo-claro p-3 text-sm text-[#7A4A00]">Se ${a.nome} foi adotado, use <b>"Marcar como adotado"</b>. Assim a adoção entra nas estatísticas da ONG.</p>
    <div class="mt-4 flex gap-2"><button onclick="fecharModal()" class="flex-1 rounded-xl py-3 font-bold ring-2 ring-slate-200">Cancelar</button>
    <button onclick="excluir('${id}')" class="flex-1 rounded-xl bg-vermelho py-3 font-extrabold text-white">Excluir</button></div>`);
}
function excluir(id) { // RN05: no site real, remove primeiro as fotos do Storage, depois o registro
  const a = animais.find(x => x.id === id);
  animais = animais.filter(x => x.id !== id); fecharModal(); location.hash = '#/admin'; toast(`${a.nome} foi excluído`);
}
function addFoto(inp) { const f = inp.files[0]; if (f && fotosForm.length < 3) { fotosForm.push(URL.createObjectURL(f)); render(); } }
function salvar(id, form) {
  const nome = form.querySelector('[name=nome]').value.trim() || 'Sem nome';
  if (!id) {
    const novo = { id: 'novo' + Date.now(), nome, especie: (form.querySelector('[name=especie]:checked') || {}).value || 'cao',
      sexo: (form.querySelector('[name=sexo]:checked') || {}).value || 'macho', nascimento_aprox: mesesAtras(12),
      porte: (form.querySelector('[name=porte]:checked') || {}).value || 'medio', castrado: false, vacinado: false, vermifugado: false,
      docil: null, convive_animais: null, descricao: '', status: 'disponivel', data_entrada: new Date(), responsavel_tipo: 'ong',
      responsavel_nome: 'SOS Patas', fotos: [...fotosForm], cor: '#94A3B8', privado: { lar_nome: form.querySelector('[name=lar]').value || '—', lar_tipo: 'provisorio', observacoes: '' } };
    animais.push(novo);
  } else { const a = animais.find(x => x.id === id); a.nome = nome; a.fotos = [...fotosForm]; }
  telaForm._ultimo = null; location.hash = '#/admin'; toast(id ? 'Alterações salvas ✓' : `${nome} publicado no site ✓`);
}
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'fixed left-1/2 top-4 z-[60] -translate-x-1/2 rounded-full bg-slate-900 px-5 py-3 text-sm font-bold text-white shadow-xl';
  t.textContent = msg; document.body.appendChild(t); setTimeout(() => t.remove(), 2500);
}
function abrirMenu() { const m = document.getElementById('menu-mobile'); m.hidden = !m.hidden; }
function toggleProto() { const m = document.getElementById('proto-menu'); m.hidden = !m.hidden; }

// ---------------------------------------------------------------------------
// Rotas
// ---------------------------------------------------------------------------
function render() {
  const h = location.hash.replace(/^#/, '') || '/';
  const p = h.split('/').filter(Boolean);
  let html;
  if (h === '/') html = telaInicio();
  else if (p[0] === 'animais') html = telaVitrine();
  else if (p[0] === 'animal') html = telaFicha(p[1]);
  else if (p[0] === 'como-adotar') html = telaComoAdotar();
  else if (p[0] === 'perguntas') html = telaPerguntas();
  else if (p[0] === 'sobre') html = telaSobre();
  else if (p[0] === 'privacidade') html = telaPrivacidade();
  else if (p[0] === 'admin' && p[1] === 'login') html = telaLogin();
  else if (p[0] === 'admin' && p[1] === 'novo') html = telaForm(null);
  else if (p[0] === 'admin' && p[1] === 'editar') html = telaForm(p[2]);
  else if (p[0] === 'admin') html = telaPainel();
  else html = telaInicio();
  document.getElementById('app').innerHTML = html;
  document.getElementById('proto-menu').hidden = true;
}
let ultimaRota = '';
window.addEventListener('hashchange', () => { if (location.hash !== ultimaRota) { ultimaRota = location.hash; window.scrollTo(0, 0); } render(); });
if (new URLSearchParams(location.search).has('print')) document.getElementById('proto-btn').hidden = true;
render();
</script>
</body>
</html>
