name: CI

on:
  pull_request:
  push:
    branches: [main, develop]

jobs:
  verificar:
    name: Lint, tipos, testes e build
    runs-on: ubuntu-latest

    # Postgres para os testes do banco e da API (mesma versão do Neon).
    # Imagem oficial pelo espelho da AWS: o Docker Hub limita downloads anônimos
    # e os runners do GitHub batem nesse limite (erro toomanyrequests).
    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:18
        env:
          POSTGRES_USER: sospatas
          POSTGRES_PASSWORD: sospatas
          POSTGRES_DB: sospatas_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sospatas -d sospatas_teste"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v5

      # Versão do pnpm vem do campo packageManager do package.json
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Também gera apps/api/worker-configuration.d.ts (postinstall da API)
      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
